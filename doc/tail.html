<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('themebtn'), order=['auto','light','dark'];
  function get(){try{return localStorage.getItem('aof-theme')||'auto'}catch(e){return 'auto'}}
  function apply(t){ if(t==='auto'){root.removeAttribute('data-theme')}else{root.setAttribute('data-theme',t)} if(btn)btn.textContent='Theme: '+t; }
  var cur=get(); if(cur!=='auto')apply(cur);
  if(btn)btn.addEventListener('click',function(){cur=order[(order.indexOf(cur)+1)%3];apply(cur);try{localStorage.setItem('aof-theme',cur)}catch(e){}});
  var eb=document.getElementById('expandbtn');
  if(eb)eb.addEventListener('click',function(){var d=document.querySelectorAll('details.srcfile'),open=eb.textContent.indexOf('Expand')===0;
    for(var i=0;i<d.length;i++)d[i].open=open; eb.textContent=open?'Collapse all files':'Expand all files';});
})();
</script>
<script>
/* q syntax highlighting: keywords from the q language files, minus this stack's column names */
(function(){
  var KW=new Set("abs acos aj aj0 ajf ajf0 all and any asc asin asof atan attr avg avgs bin by ceiling cols cor cos count cov cross csv cut delete deltas desc dev differ distinct div do dsave each ej ema enlist eval except exec exit exp fby fills first fkeys flip floor from get getenv group gtime hclose hcount hdel hopen hsym iasc idesc if ij ijf in insert inter inv key keys last like lj load log lower lsq ltime ltrim mavg max maxs mcount md5 mdev med meta min mins mmax mmin mmu mod msum neg next not null or over parse peach pj plist prd prds prev prior rand rank ratios raze read0 read1 reciprocal reval reverse rload rotate rsave rtrim save scan scov sdev select set setenv show signum sin sqrt ss ssr sublist sum sums sv svar system tables tan til trim type uj ujf ungroup union update upper upsert value var view views vs wavg where while within wj wj1 wsum ww xasc xbar xcol xcols xdesc xexp xgroup xkey xlog xprev xrank".split(" "));
  var RE=/("(?:\\.|[^"\\])*")|((?:^|(?<=[ \t]))\/(?![:\\]).*)|(^q\)+)|(`[\w.:\/]*)|((?<![\w`])\.[A-Za-z]\w*(?:\.\w+)*)|((?<![\w.`])-?\d[\w:.]*)|((?<![\w.`])[a-z]\w*)|(^\\\w*)/gm;
  var CLS=[null,"s","c","p","y","z","d","k","z"];
  function hl(node){
    var t=node.nodeValue, out=document.createDocumentFragment(), last=0, m, hit=false; RE.lastIndex=0;
    while((m=RE.exec(t))){
      var g=1; while(g<CLS.length && m[g]===undefined) g++;
      if(g===7 && !KW.has(m[0])) continue;
      if(m.index>last) out.appendChild(document.createTextNode(t.slice(last,m.index)));
      var sp=document.createElement("span"); sp.className=CLS[g]; sp.textContent=m[0]; out.appendChild(sp);
      last=m.index+m[0].length; hit=true;
      if(m[0].length===0) RE.lastIndex++;
    }
    if(!hit) return;
    if(last<t.length) out.appendChild(document.createTextNode(t.slice(last)));
    node.parentNode.replaceChild(out,node);
  }
  document.querySelectorAll(".code pre").forEach(function(pre){
    var first=pre.textContent.replace(/^\s+/,"").split("\n")[0];
    if(/^(#!|---|mkdir|\$ |exec-tca-stack\/|cd |git |printf )/.test(first)) return;
    var w=document.createTreeWalker(pre,NodeFilter.SHOW_TEXT,{acceptNode:function(n){return n.parentNode.closest(".c,.s,.k,.y,.z,.d,.p")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
    var ns=[]; while(w.nextNode()) ns.push(w.currentNode); ns.forEach(hl);
  });
})();
</script>
<script>
document.documentElement.lang='en';
document.querySelectorAll('.code').forEach(function(box){
  var b=document.createElement('button');b.type='button';b.textContent='Copy';box.appendChild(b);
  b.addEventListener('click',function(){
    var pre=box.querySelector('pre'),t=pre.innerText;
    var done=function(){b.textContent='Copied';setTimeout(function(){b.textContent='Copy'},1400)};
    var sel=function(){var r=document.createRange();r.selectNodeContents(pre);var s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected'};
    try{navigator.clipboard.writeText(t).then(done,sel)}catch(e){sel()}
  });
});
</script>
